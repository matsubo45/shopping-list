<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>買い物リスト</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="app-header">
        <h1>🛒 買い物リスト</h1>
    </header>

    <main class="app-main">

        <!-- ===== カテゴリ管理エリア ===== -->
        <section class="card" id="categoryManageSection">
            <h2 class="card-title">カテゴリ管理</h2>

            <ul id="categoryManageList" class="category-manage-list">
                <!-- カテゴリの一覧（削除ボタン付き）はJSで生成 -->
            </ul>

            <div class="input-row">
                <input
                    id="newCategoryInput"
                    type="text"
                    placeholder="新しいカテゴリ名">
                <button id="addCategoryButton" class="btn btn-secondary">カテゴリ追加</button>
            </div>
        </section>

        <!-- ===== アイテム追加エリア ===== -->
        <section class="card" id="addItemSection">
            <h2 class="card-title">アイテムを追加</h2>

            <div class="input-row">
                <select id="categorySelect">
                    <!-- カテゴリの選択肢はJSで生成 -->
                </select>

                <input
                    id="itemInput"
                    type="text"
                    placeholder="商品名を入力">

                <button id="addButton" class="btn btn-primary">追加</button>
            </div>
        </section>

        <!-- ===== リスト表示エリア（カテゴリごとにグループ表示） ===== -->
        <section id="itemListContainer" class="item-list-container">
            <!-- カテゴリごとのグループ（見出し＋リスト）はJSで生成 -->
        </section>

    </main>

    <!-- ===== Firebase 初期化・DB操作まわり ===== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-analytics.js";
        import {
            getFirestore,
            collection,
            addDoc,
            deleteDoc,
            updateDoc,
            doc,
            onSnapshot
        } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

        // Firebaseの設定（このプロジェクト用の設定情報）
        const firebaseConfig = {
            apiKey: "AIzaSyDnFNhzmxh25TRmKHukP4UaUhH9svjDM6E",
            authDomain: "shopping-list-784cb.firebaseapp.com",
            projectId: "shopping-list-784cb",
            storageBucket: "shopping-list-784cb.firebasestorage.app",
            messagingSenderId: "319798455031",
            appId: "1:319798455031:web:fdfb957a3a2b3ac23601f2",
            measurementId: "G-E3HT781ELC"
        };

        // Firebase初期化
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        // デフォルトで用意しておくカテゴリ（Firestoreに何も無い場合だけ使う）
        const DEFAULT_CATEGORIES = ["スーパー", "ドラッグストア", "100均"];

        // ---------- 買い物アイテム関連 ----------

        // 買い物アイテムの変更をリアルタイムで監視し、app.js側に渡す
        function startItemsListener() {
            onSnapshot(collection(db, "shoppingItems"), (snapshot) => {
                const items = [];
                snapshot.forEach((docSnap) => {
                    items.push({
                        id: docSnap.id,
                        text: docSnap.data().text,
                        checked: docSnap.data().checked,
                        category: docSnap.data().category
                    });
                });
                window.setItems(items);
            });
        }

        // アイテムをFirestoreに追加
        async function addItemToFirestore(text, category) {
            await addDoc(collection(db, "shoppingItems"), {
                text: text,
                checked: false,
                category: category
            });
        }

        // アイテムのチェック状態を更新
        async function updateItemChecked(id, checked) {
            await updateDoc(doc(db, "shoppingItems", id), {
                checked: checked
            });
        }

        // アイテムを削除
        async function deleteItemFromFirestore(id) {
            await deleteDoc(doc(db, "shoppingItems", id));
        }

        // ---------- カテゴリ関連 ----------

        let categoriesInitialized = false;

        // カテゴリの変更をリアルタイムで監視し、app.js側に渡す
        function startCategoriesListener() {
            onSnapshot(collection(db, "categories"), (snapshot) => {

                // Firestoreにカテゴリが1件も無い場合は、初回のみデフォルトを登録する
                if (!categoriesInitialized && snapshot.empty) {
                    categoriesInitialized = true;
                    DEFAULT_CATEGORIES.forEach((name) => addCategoryToFirestore(name));
                    return;
                }
                categoriesInitialized = true;

                const categories = [];
                snapshot.forEach((docSnap) => {
                    categories.push({
                        id: docSnap.id,
                        name: docSnap.data().name
                    });
                });
                window.setCategories(categories);
            });
        }

        // カテゴリをFirestoreに追加
        async function addCategoryToFirestore(name) {
            await addDoc(collection(db, "categories"), { name: name });
        }

        // カテゴリをFirestoreから削除
        async function deleteCategoryFromFirestore(id) {
            await deleteDoc(doc(db, "categories", id));
        }

        // app.js（グローバル）から呼び出せるようにする
        window.addItemToFirestore = addItemToFirestore;
        window.updateItemChecked = updateItemChecked;
        window.deleteItemFromFirestore = deleteItemFromFirestore;
        window.addCategoryToFirestore = addCategoryToFirestore;
        window.deleteCategoryFromFirestore = deleteCategoryFromFirestore;

        // リアルタイム監視を開始
        startItemsListener();
        startCategoriesListener();
    </script>

    <script src="app.js"></script>

</body>

</html>
