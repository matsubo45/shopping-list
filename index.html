<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>買い物リスト</title>
    <link rel="stylesheet" href="style.css">

    <!-- ===== PWA（ホーム画面に追加）用の設定 ===== -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2F6F4F">

    <!-- Android（ホーム画面アイコン） -->
    <link rel="icon" href="icon-192.png">

    <!-- iOS Safari（ホーム画面アイコン・スタンドアロン表示） -->
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="買い物リスト">
</head>

<body>

    <header class="app-header">
        <h1>🛒 買い物リスト</h1>
    </header>

    <!-- ===== ログイン前に表示する画面 ===== -->
    <section class="card" id="loginSection">
        <p>買い物リストを見るにはログインしてください。</p>

        <div class="input-row login-input-row">
            <input
                id="loginEmail"
                type="email"
                placeholder="メールアドレス"
                autocomplete="username"
                autocapitalize="off"
                autocorrect="off"
                spellcheck="false">
        </div>
        <div class="input-row login-input-row">
            <input
                id="loginPassword"
                type="password"
                placeholder="パスワード"
                autocomplete="current-password"
                autocapitalize="off"
                autocorrect="off"
                spellcheck="false">
            <button type="button" id="togglePasswordButton" class="btn btn-secondary btn-small">表示</button>
        </div>

        <button id="loginButton" class="btn btn-primary">ログイン</button>
    </section>

    <!-- ===== ログイン後に表示するユーザー情報バー ===== -->
    <div id="userBar" class="user-bar" style="display: none;">
        <span id="userName"></span>
        <button id="logoutButton" class="btn btn-delete btn-small">ログアウト</button>
    </div>

    <!-- ===== ログイン後のみ表示するメインコンテンツ ===== -->
    <main class="app-main" id="appMain" style="display: none;">

        <!-- ===== カテゴリ管理エリア（普段はあまり使わないので折りたたみ式にする） ===== -->
        <details class="card" id="categoryManageSection">
            <summary class="card-title collapsible-title">カテゴリ管理</summary>

            <ul id="categoryManageList" class="category-manage-list">
                <!-- カテゴリの一覧（削除ボタン付き）はJSで生成 -->
            </ul>

            <div class="input-row">
                <input
                    id="newCategoryInput"
                    type="text"
                    placeholder="新しいカテゴリ名">
                <button id="addCategoryButton" class="btn btn-secondary">カテゴリ追加</button>
            </div>
        </details>

        <!-- ===== アイテム追加エリア ===== -->
        <section class="card" id="addItemSection">
            <h2 class="card-title">アイテムを追加</h2>

            <div class="input-row">
                <select id="categorySelect">
                    <!-- カテゴリの選択肢はJSで生成 -->
                </select>

                <input
                    id="itemInput"
                    type="text"
                    placeholder="商品名を入力">

                <button id="addButton" class="btn btn-primary">追加</button>
            </div>
        </section>

        <!-- ===== リスト表示エリア（カテゴリごとにグループ表示） ===== -->
        <section id="itemListContainer" class="item-list-container">
            <!-- カテゴリごとのグループ（見出し＋リスト）はJSで生成 -->
        </section>

    </main>

    <!-- ===== Firebase 初期化・DB操作まわり ===== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-analytics.js";
        import {
            getFirestore,
            collection,
            addDoc,
            deleteDoc,
            updateDoc,
            doc,
            onSnapshot,
            enableIndexedDbPersistence
        } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";
        import {
            getAuth,
            signInWithEmailAndPassword,
            signOut,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

        // Firebaseの設定（このプロジェクト用の設定情報）
        const firebaseConfig = {
            apiKey: "AIzaSyDnFNhzmxh25TRmKHukP4UaUhH9svjDM6E",
            authDomain: "shopping-list-784cb.firebaseapp.com",
            projectId: "shopping-list-784cb",
            storageBucket: "shopping-list-784cb.firebasestorage.app",
            messagingSenderId: "319798455031",
            appId: "1:319798455031:web:fdfb957a3a2b3ac23601f2",
            measurementId: "G-E3HT781ELC"
        };

        // Firebase初期化
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // オフラインでも直前までのデータを表示できるようにする
        // （通信が不安定な時や、ホーム画面から開いた直後に有効）
        enableIndexedDbPersistence(db).catch((error) => {
            console.warn("オフライン永続化を有効化できませんでした:", error.code);
        });

        // デフォルトで用意しておくカテゴリ（Firestoreに何も無い場合だけ使う）
        const DEFAULT_CATEGORIES = ["スーパー", "ドラッグストア", "100均"];

        // ---------- 買い物アイテム関連 ----------

        // 買い物アイテムの変更をリアルタイムで監視し、app.js側に渡す
        function startItemsListener() {
            onSnapshot(collection(db, "shoppingItems"), (snapshot) => {
                const items = [];
                snapshot.forEach((docSnap) => {
                    items.push({
                        id: docSnap.id,
                        text: docSnap.data().text,
                        checked: docSnap.data().checked,
                        category: docSnap.data().category,
                        starred: docSnap.data().starred || false
                    });
                });
                window.setItems(items);
            });
        }

        // アイテムをFirestoreに追加
        async function addItemToFirestore(text, category) {
            await addDoc(collection(db, "shoppingItems"), {
                text: text,
                checked: false,
                category: category
            });
        }

        // アイテムのチェック状態を更新
        async function updateItemChecked(id, checked) {
            await updateDoc(doc(db, "shoppingItems", id), {
                checked: checked
            });
        }

        // アイテムのテキスト（商品名）を更新
        async function updateItemText(id, text) {
            await updateDoc(doc(db, "shoppingItems", id), {
                text: text
            });
        }

        // アイテムの「すぐ買う」スター状態を更新
        async function updateItemStarred(id, starred) {
            await updateDoc(doc(db, "shoppingItems", id), {
                starred: starred
            });
        }

        // アイテムを削除
        async function deleteItemFromFirestore(id) {
            await deleteDoc(doc(db, "shoppingItems", id));
        }

        // ---------- カテゴリ関連 ----------

        let categoriesInitialized = false;

        // カテゴリの変更をリアルタイムで監視し、app.js側に渡す
        function startCategoriesListener() {
            onSnapshot(collection(db, "categories"), (snapshot) => {

                // Firestoreにカテゴリが1件も無い場合は、初回のみデフォルトを登録する
                if (!categoriesInitialized && snapshot.empty) {
                    categoriesInitialized = true;
                    DEFAULT_CATEGORIES.forEach((name) => addCategoryToFirestore(name));
                    return;
                }
                categoriesInitialized = true;

                const categories = [];
                snapshot.forEach((docSnap) => {
                    categories.push({
                        id: docSnap.id,
                        name: docSnap.data().name
                    });
                });
                window.setCategories(categories);
            });
        }

        // カテゴリをFirestoreに追加
        async function addCategoryToFirestore(name) {
            await addDoc(collection(db, "categories"), { name: name });
        }

        // カテゴリをFirestoreから削除
        async function deleteCategoryFromFirestore(id) {
            await deleteDoc(doc(db, "categories", id));
        }

        // ---------- ログイン・ログアウト関連 ----------

        // メールアドレス・パスワードでログインする
        function login(email, password) {
            return signInWithEmailAndPassword(auth, email, password).catch((error) => {
                console.error("ログインエラー:", error);
                alert("ログインに失敗しました。メールアドレスとパスワードを確認してください。");
            });
        }

        // ログアウトする
        function logout() {
            signOut(auth);
        }

        window.login = login;
        window.logout = logout;

        // app.js（グローバル）から呼び出せるようにする
        window.addItemToFirestore = addItemToFirestore;
        window.updateItemChecked = updateItemChecked;
        window.updateItemText = updateItemText;
        window.updateItemStarred = updateItemStarred;
        window.deleteItemFromFirestore = deleteItemFromFirestore;
        window.addCategoryToFirestore = addCategoryToFirestore;
        window.deleteCategoryFromFirestore = deleteCategoryFromFirestore;

        // 画面の要素（ログイン前/後で表示を切り替えるため）
        const loginSection = document.getElementById("loginSection");
        const userBar = document.getElementById("userBar");
        const userName = document.getElementById("userName");
        const appMain = document.getElementById("appMain");

        let listenersStarted = false; // リアルタイム監視を1度だけ開始するためのフラグ

        // ログイン状態の変化を監視する
        // ログインしている時だけFirestoreの監視を開始し、画面を表示する
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // ログイン済み：メイン画面を表示
                loginSection.style.display = "none";
                userBar.style.display = "flex";
                appMain.style.display = "block";
                userName.textContent = user.email + "さん";

                if (!listenersStarted) {
                    listenersStarted = true;
                    startItemsListener();
                    startCategoriesListener();
                }
            } else {
                // 未ログイン：ログイン画面のみ表示
                loginSection.style.display = "block";
                userBar.style.display = "none";
                appMain.style.display = "none";
            }
        });
    </script>

    <script src="app.js"></script>

</body>

</html>
